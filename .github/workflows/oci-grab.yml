name: OCI free instance retry
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: oci-single-launch
  cancel-in-progress: false
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install OCI SDK
        run: python -m pip install 'oci==2.189.0'
      - name: Retry free A1 instance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OCI_SETTINGS: ${{ secrets.OCI_SETTINGS }}
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
          DRY_RUN: '0'
        run: python grab.py
