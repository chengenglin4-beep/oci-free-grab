name: OCI read-only validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oci-check.yml'
permissions:
  contents: read
concurrency:
  group: oci-single-launch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install OCI SDK
        run: python -m pip install 'oci==2.189.0'
      - name: Check configuration without creating anything
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OCI_SETTINGS: ${{ secrets.OCI_SETTINGS }}
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
          DRY_RUN: '1'
        run: python inspect_oci.py

